# Main configuration for TAHER

system:
  name: "TAHER"
  version: "0.1.0-alpha"
  debug: true

models:
  primary: "qwen3:8b"
  coder: "qwen3:8b"
  vision: "moondream"
  stt: "faster-whisper"
  tts: "piper"
  embeddings: "all-Minilm-L6-v2"

memory:
  db_type: "chromadb"
  path: "./memory/db"

gui:
  theme: "dark"
  animations: true

sandbox:
  enabled: true
  vm_ip: "192.168.x.x" # To be configured by user
  ssh_user: "jules"
